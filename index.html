<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS // SYSTEM HUD</title>
<style>
:root{--cyan:#38e7ff;--blue:#4d83ff;--green:#65ffbd;--amber:#ffc857;--red:#ff5364;--text:#e9f7ff;--muted:#7894a5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#02050a}
#bgMedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.08) brightness(.40);transform:scale(1.04)}
canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.95}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.04) 12%,rgba(0,0,0,.46) 60%,rgba(0,0,0,.90) 100%);pointer-events:none}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen;pointer-events:none}
.frame{position:absolute;inset:4.5%;border:1px solid rgba(56,231,255,.18);box-shadow:inset 0 0 35px rgba(0,180,255,.045);pointer-events:none}
.corner{position:absolute;width:14%;height:14%;border-color:rgba(56,231,255,.65);border-style:solid}
.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.top{position:absolute;top:8%;left:9%;right:9%;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:2px;font-size:7px;color:var(--muted)}
.brand{font-weight:900;color:var(--cyan);font-size:10px;letter-spacing:3px}.online{display:flex;align-items:center;gap:5px}.led{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-53%);width:62vmin;height:62vmin;max-width:390px;max-height:390px;display:grid;place-items:center}
.ring,.ring2,.ring3{position:absolute;border-radius:50%;border:1px solid rgba(56,231,255,.16)}
.ring{inset:7%;border-top-color:var(--cyan);border-bottom-color:rgba(56,231,255,.04);animation:spin 15s linear infinite}
.ring2{inset:16%;border-style:dashed;border-color:rgba(77,131,255,.25);animation:spin 24s linear infinite reverse}
.ring3{inset:27%;border-left-color:rgba(101,255,189,.45);border-right-color:transparent;animation:spin 8s linear infinite}
.ring:before,.ring2:before,.ring3:before{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);top:-2px;left:50%}
.sweep{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 0deg,rgba(56,231,255,.22),transparent 14%,transparent 100%);-webkit-mask:radial-gradient(circle,transparent 0 55%,#000 56% 57%,transparent 58%);mask:radial-gradient(circle,transparent 0 55%,#000 56% 57%,transparent 58%);animation:spin 4s linear infinite}
.core{position:relative;text-align:center;z-index:2}
.temp{font-size:clamp(64px,19vmin,112px);font-weight:900;line-height:.8;letter-spacing:-6px;text-shadow:0 0 30px rgba(56,231,255,.28)}
.unit{font-size:11px;color:var(--cyan);vertical-align:top;margin-left:5px;letter-spacing:1px}
.title{margin-top:15px;font-size:8px;letter-spacing:3px;color:#b7d0dc}.state{margin-top:6px;font-size:7px;color:var(--green);letter-spacing:2px}
.telemetry{position:absolute;left:9%;right:9%;bottom:13%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.metric{border-top:1px solid rgba(56,231,255,.22);padding-top:6px;text-align:center;background:linear-gradient(180deg,rgba(10,30,42,.2),transparent)}
.metric .v{font-size:11px;font-weight:800}.metric .k{font-size:6px;color:var(--muted);letter-spacing:1.4px;margin-top:3px}
.bottom{position:absolute;bottom:7%;left:9%;right:9%;display:flex;justify-content:space-between;font-size:6px;color:#587383;letter-spacing:1.5px}
.alert{color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-aspect-ratio:1/1){.hero{width:68vmin;height:68vmin}.telemetry{bottom:12%}}
</style>
</head>
<body>
<div id="app">
<video id="bgMedia" autoplay muted loop playsinline preload="auto"><source src="Cosmic_Anime_Eyes_4K.mp4" type="video/mp4"></video>
<div class="vignette"></div><div class="scanlines"></div>
<div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>

<div class="top">
  <div><span class="brand">NEXUS</span> // KRAKEN COMMAND</div>
  <div class="online"><i class="led"></i> SYSTEM ONLINE</div>
</div>

<div class="hero">
  <div class="ring"></div><div class="ring2"></div><div class="ring3"></div><div class="sweep"></div>
  <div class="core">
    <span id="cpu" class="temp">42</span><span class="unit">°C</span>
    <div class="title">7800X3D // THERMAL CORE</div>
    <div id="state" class="state">● NOMINAL</div>
  </div>
</div>

<div class="telemetry">
  <div class="metric"><div id="gpu" class="v">49°</div><div class="k">RTX 5070</div></div>
  <div class="metric"><div id="ram" class="v">31%</div><div class="k">MEMORY</div></div>
  <div class="metric"><div id="liquid" class="v">34°</div><div class="k">LIQUID</div></div>
  <div class="metric"><div id="rpm" class="v">--</div><div class="k">PUMP RPM</div></div>
</div>

<div class="bottom">
  <span id="clock">00:00:00</span>
  <span id="fps">CAM // LIVE TELEMETRY</span>
  <span class="alert">SECURE LINK</span>
</div>
</div>

<script>
/* Cosmic Anime Eyes video background. */
const $=id=>document.getElementById(id);
function n(v){v=Number(v);return Number.isFinite(v)?v:null}
function read(o,paths){for(const p of paths){let x=o;for(const k of p.split(".")){if(x==null)break;x=x[k]}if(x!=null)return x}return null}
function first(...x){for(const v of x){const z=n(v);if(z!==null)return z}return null}
function render(data){
 const cpu=first(read(data,["cpus.0.temperature","cpus.0.temp","cpu.temperature","cpu.temp"]));
 const gpu=first(read(data,["gpus.0.temperature","gpus.0.temp","gpu.temperature","gpu.temp"]));
 const ram=first(read(data,["ram.load","ram.usage","ram.utilization"]));
 const liquid=first(read(data,["kraken.liquidTemperature","kraken.liquidTemp","kraken.temperature","kraken.liquid.temperature"]));
 const rpm=first(read(data,["kraken.pumpRpm","kraken.pumpRPM","pump.rpm","pump.rpm.current"]));
 if(cpu!==null)$("cpu").textContent=Math.round(cpu);
 if(gpu!==null)$("gpu").textContent=Math.round(gpu)+"°";
 if(ram!==null)$("ram").textContent=Math.round(ram)+"%";
 if(liquid!==null)$("liquid").textContent=Math.round(liquid)+"°";
 if(rpm!==null)$("rpm").textContent=Math.round(rpm);
 if(cpu!==null)$("state").textContent=cpu<60?"● NOMINAL":cpu<80?"● THERMAL WATCH":"● HIGH TEMP";
}
window.nzxt={v1:{onMonitoringDataUpdate:render}};
function demo(){
 const b=Number(localStorage.getItem("nexusTemp")||42)+Math.sin(Date.now()/1700)*1.5;
 $("cpu").textContent=Math.round(b);$("gpu").textContent=Math.round(b+7)+"°";
 $("ram").textContent=Math.round(28+Math.sin(Date.now()/2200)*5)+"%";
 $("liquid").textContent=Math.round(b-8)+"°";$("rpm").textContent=Math.round(2400+Math.sin(Date.now()/1200)*180);
}
setInterval(()=>{if(!new URLSearchParams(location.search).has("kraken"))demo()},700);
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("tr-TR",{hour12:false})},250);
</script>
</body>
</html>
